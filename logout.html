<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out | Smart Expense Tracker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="card auth-card text-center" style="max-width: 440px;">
        <div class="mb-3">
            <span style="font-size: 3.5rem;">👋</span>
        </div>
        <h3 class="fw-bold text-success mb-2">Signed Out Safely</h3>
        <p class="text-muted small mb-4">
            Thank you for managing your finances with Smart Expense Tracker. Your session has been safely closed.
        </p>

        <div class="d-flex justify-content-center mb-3">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <p class="small text-muted mb-4">
            Redirecting to login in <strong id="countdown" class="text-dark">3</strong> seconds...
        </p>

        <div class="d-grid gap-2">
            <a href="login.html" class="btn btn-primary fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Login Again
            </a>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-house me-1"></i> Return Home
            </a>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
