<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 40%, #3b82f6 70%, #06b6d4 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            padding: 1rem;
        }
        .auth-wrapper { width: 100%; max-width: 420px; }
        .auth-card {
            background: #ffffff; border-radius: 20px; padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25); border: none;
        }
        .brand-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.25rem; font-size: 2rem;
            box-shadow: 0 8px 20px rgba(29,78,216,0.35);
        }
        .auth-brand { text-align: center; margin-bottom: 2rem; }
        .auth-brand h3 { font-weight: 800; color: #111827; font-size: 1.6rem; margin-bottom: 0.3rem; }
        .auth-brand p { color: #6b7280; font-size: 0.9rem; }
        .form-label { font-weight: 600; font-size: 0.85rem; color: #374151; margin-bottom: 0.4rem; }
        .input-group-text { background: #f9fafb; border-color: #d1d5db; color: #6b7280; }
        .form-control { border-color: #d1d5db; padding: 0.65rem 0.9rem; font-size: 0.95rem; }
        .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .btn-signin {
            background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%);
            border: none; border-radius: 10px; padding: 0.75rem; font-size: 1rem;
            font-weight: 700; color: #fff; width: 100%;
            box-shadow: 0 4px 15px rgba(59,130,246,0.35); cursor: pointer;
            transition: all 0.2s;
        }
        .btn-signin:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59,130,246,0.45); }
        .demo-badge {
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border: 1px solid #6ee7b7; border-radius: 10px;
            padding: 0.75rem 1rem; margin-bottom: 1.25rem; text-align: center;
        }
        .demo-badge .bt { font-weight: 700; color: #065f46; font-size: 0.85rem; }
        .demo-badge .bc { color: #047857; font-size: 0.82rem; font-family: monospace; }
        #loginError {
            display: none; background: #fef2f2; border: 1px solid #fca5a5;
            border-radius: 8px; color: #dc2626; padding: 0.6rem 0.9rem;
            font-size: 0.88rem; margin-bottom: 1rem;
        }
        .auth-footer { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid #e5e7eb; text-align: center; }
        .auth-footer a { color: #2563eb; font-weight: 600; text-decoration: none; }
        .back-link { display: inline-flex; align-items: center; gap: 4px; color: #6b7280; font-size: 0.85rem; text-decoration: none; margin-top: 0.5rem; }
    </style>
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-icon">??</div>
            <h3>Welcome Back</h3>
            <p>Sign in to your Expense Tracker account</p>
        </div>
        <div class="demo-badge">
            <div class="bt">?? Demo Account Ready</div>
            <div class="bc">admin@gmail.com &nbsp;/&nbsp; admin123</div>
        </div>
        <div id="loginError"></div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" class="form-control" placeholder="admin@gmail.com" value="admin@gmail.com" required>
                </div>
            </div>
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label mb-0">Password</label>
                    <a href="#" style="font-size:0.8rem;color:#2563eb;text-decoration:none;">Forgot?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" value="admin123" required>
                    <button type="button" class="input-group-text" onclick="togglePwd()" style="cursor:pointer;border-color:#d1d5db;background:#f9fafb;">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="remember" checked>
                <label class="form-check-label" for="remember" style="font-size:0.85rem;color:#6b7280;">Keep me signed in</label>
            </div>
            <button type="submit" class="btn-signin">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>
        <div class="auth-footer">
            <p style="font-size:0.88rem;color:#6b7280;margin-bottom:0.5rem;">
                Don't have an account? <a href="register.html">Create Account</a>
            </p>
            <a href="index.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to Homepage</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
function togglePwd(){
    var p=document.getElementById("password"),i=document.getElementById("eyeIcon");
    if(p.type==="password"){p.type="text";i.className="bi bi-eye-slash";}
    else{p.type="password";i.className="bi bi-eye";}
}
</script>
</body>
</html>
