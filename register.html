<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Track your daily expenses, analyze spending, and manage budgets efficiently with Smart Expense Tracker.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
    <title>Create Account | Smart Expense Tracker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 40%, #3b82f6 70%, #06b6d4 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif; padding: 1rem;
        }
        .auth-wrapper { width: 100%; max-width: 500px; }
        .auth-card {
            background: #ffffff; border-radius: 20px; padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25); border: none;
        }
        .brand-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem; font-size: 1.8rem;
            box-shadow: 0 6px 16px rgba(29,78,216,0.35);
        }
        .auth-brand { text-align: center; margin-bottom: 1.75rem; }
        .auth-brand h3 { font-weight: 800; color: #111827; font-size: 1.5rem; margin-bottom: 0.25rem; }
        .auth-brand p { color: #6b7280; font-size: 0.88rem; }
        .form-label { font-weight: 600; font-size: 0.85rem; color: #374151; margin-bottom: 0.35rem; }
        .input-group-text { background: #f9fafb; border-color: #d1d5db; color: #6b7280; }
        .form-control { border-color: #d1d5db; padding: 0.6rem 0.85rem; font-size: 0.92rem; }
        .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .btn-register {
            background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%);
            border: none; border-radius: 10px; padding: 0.7rem; font-size: 0.95rem;
            font-weight: 700; color: #fff; width: 100%;
            box-shadow: 0 4px 15px rgba(59,130,246,0.35); cursor: pointer; transition: all 0.2s;
        }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59,130,246,0.45); }
    </style>
</head>
<body>

<div class="auth-wrapper" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div class="card auth-card" style="max-width: 500px;">
        <div class="auth-brand">
            <div class="brand-icon">
                <span>💰</span>
            </div>
            <h3 class="fw-bold text-dark mb-1">Create an Account</h3>
            <p class="text-muted small mb-0">Start tracking your finances smartly today</p>
        </div>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-person text-muted"></i>
                    </span>
                    <input type="text" id="name" class="form-control border-start-0 ps-0" 
                           placeholder="John Doe" required>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-sm-6">
                    <label class="form-label fw-semibold small text-secondary">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-envelope text-muted"></i>
                        </span>
                        <input type="email" id="email" class="form-control border-start-0 ps-0" 
                               placeholder="john@example.com" required>
                    </div>
                </div>
                <div class="col-sm-6">
                    <label class="form-label fw-semibold small text-secondary">Mobile Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-telephone text-muted"></i>
                        </span>
                        <input type="tel" id="mobile" class="form-control border-start-0 ps-0" 
                               placeholder="9876543210" required>
                    </div>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-sm-6">
                    <label class="form-label fw-semibold small text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" id="password" class="form-control border-start-0 ps-0" 
                               placeholder="Create password" required minlength="4">
                    </div>
                </div>
                <div class="col-sm-6">
                    <label class="form-label fw-semibold small text-secondary">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-shield-lock text-muted"></i>
                        </span>
                        <input type="password" id="confirmPassword" class="form-control border-start-0 ps-0" 
                               placeholder="Repeat password" required minlength="4">
                    </div>
                </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" required checked>
                <label class="form-check-label small text-muted" for="terms">
                    I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> & <a href="#" class="text-decoration-none">Privacy Policy</a>
                </label>
            </div>

            <button type="submit" class="btn-register">
                <i class="bi bi-person-check me-1"></i> Complete Registration
            </button>
        </form>

        <div class="text-center mt-4 pt-2 border-top">
            <p class="small text-muted mb-0">
                Already registered? 
                <a href="login.html" class="fw-semibold text-primary text-decoration-none">Sign In Here</a>
            </p>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
